name: 🏗 build

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          # std variants with additional features
          - name: "std"
            features: "std,crossterm,dsl"
            cargo-flags: ""
            additional-name: "sendable"
            additional-features: "sendable"
          - name: "std"
            features: "std,crossterm,dsl"
            cargo-flags: ""
            additional-name: "std-duration"
            additional-features: "std-duration"
          - name: "std"
            features: "std,crossterm,dsl"
            cargo-flags: ""
            additional-name: "web-time"
            additional-features: "web-time"
          # no-std variants (only sendable is compatible)
          - name: "no-std"
            features: "no-std"
            cargo-flags: "--no-default-features"
            additional-name: "sendable"
            additional-features: "sendable"

    runs-on: ubuntu-latest
    name: "build & test (${{ matrix.name }} + ${{ matrix.additional-name }})"

    steps:
    - uses: actions/checkout@v5
    
    - name: Build (${{ matrix.name }})
      run: cargo build --verbose ${{ matrix.cargo-flags }} --features="${{ matrix.features }}"
    
    - name: Test (${{ matrix.name }})
      run: cargo test --verbose --lib ${{ matrix.cargo-flags }} --features="${{ matrix.features }}"
    
    - name: Build (${{ matrix.name }} + ${{ matrix.additional-name }})
      run: cargo build --verbose ${{ matrix.cargo-flags }} --features="${{ matrix.features }},${{ matrix.additional-features }}"
    
    - name: Test (${{ matrix.name }} + ${{ matrix.additional-name }})
      run: cargo test --verbose --lib ${{ matrix.cargo-flags }} --features="${{ matrix.features }},${{ matrix.additional-features }}"

  clippy:
    runs-on: ubuntu-latest
    name: "clippy checks"

    steps:
    - uses: actions/checkout@v5
    
    - name: Clippy (all targets)
      run: cargo clippy --all-targets

    - name: Clippy (no-std)
      run: cargo clippy --lib --no-default-features --features=no-std
