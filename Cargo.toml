[workspace]
members = [
    ".",
    "examples/common",
    "examples/minimal",
    "examples/basic-effects",
    "examples/effect-showcase",
    "examples/tweens",
    "examples/fx-chart",
    "examples/effect-registry",
]

[package]
name = "tachyonfx"
version = "0.16.0"
edition = "2021"
license = "MIT"
description = "A ratatui library for creating shader-like effects in TUIs."
repository = "https://github.com/junkdog/tachyonfx"
homepage = "https://github.com/junkdog/tachyonfx"
documentation = "https://docs.rs/tachyonfx"
readme = "README.md"
keywords = ["ratatui", "terminal", "effects", "UI", "TUI"]
categories = ["command-line-interface"]
authors = ["Adrian Papari <junkdog@angelhill.net>"]
exclude = ["images/*.gif", "docs/assets/*.gif", ".*", "scripts/*"]

[dependencies]
anpa = { version = "0.10.0", optional = true }
bon = { version = "3.7.0", default-features = false }
bitvec = { version = "1.0.1", default-features = false, features = ["alloc"] }
compact_str = "0.9.0"
ratatui = { version = ">=0.29.0", default-features = false }
simple-easing = "1.0.1"
thiserror = { version = "2.0.15", default-features = false, features = [] }
unicode-width = "0.2.0"
web-time = { version = "1.1.0", optional = true }

[dev-dependencies]
ansi-to-tui = "7.0.0"
colorsys = "0.7.0"
regex = "1.11.1"
indoc = "2.0.6"
crossterm = "0.29.0"
criterion = "0.7.0"

[features]
default = ["crossterm", "dsl"]
crossterm = ["ratatui/crossterm"]
dsl = ["dep:anpa"]
sendable = []
std-duration = []
web-time = ["dep:web-time"]



[[bench]]
name = "color_interpolation"
harness = false

[[bench]]
name = "color_conversion"
harness = false

[[bench]]
name = "cell_filter"
harness = false

[[bench]]
name = "cell_iteration"
harness = false
