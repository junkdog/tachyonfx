[package]
name = "tachyonfx"
version = "0.16.0"
edition = "2021"
license = "MIT"
description = "A ratatui library for creating shader-like effects in TUIs."
repository = "https://github.com/junkdog/tachyonfx"
homepage = "https://github.com/junkdog/tachyonfx"
documentation = "https://docs.rs/tachyonfx"
readme = "README.md"
keywords = ["ratatui", "terminal", "effects", "UI", "TUI"]
categories = ["command-line-interface"]
authors = ["Adrian Papari <junkdog@angelhill.net>"]
exclude = ["images/*.gif", "docs/assets/*.gif", ".*", "scripts/*"]

[dependencies]
anpa = { version = "0.10.0", optional = true }
bon = { version = "3.7.0", default-features = false }
bitvec = { version = "1.0.1", default-features = false, features = ["alloc"] }
colorsys = "0.7.0"
compact_str = "0.9.0"
ratatui = { version = "0.30.0-alpha.5", default-features = false }
simple-easing = "1.0.1"
thiserror = { version = "2.0.15", default-features = false, features = [] }
unicode-width = "0.2.0"
web-time = { version = "1.1.0", optional = true }

[dev-dependencies]
regex = "1.11.1"
indoc = "2.0.6"
crossterm = "0.29.0"
criterion = "0.7.0"

[features]
default = ["std", "crossterm", "dsl"]
std = ["thiserror/std", "ratatui/std", "bon/std"]
crossterm = ["std", "ratatui/crossterm"]
dsl = ["dep:anpa"]
sendable = []
std-duration = ["std"]
web-time = ["dep:web-time"]


[[example]]
name = "minimal"

[[example]]
# for fx module docs
name = "effect-showcase"

[[example]]
name = "open-window"

[[example]]
name = "basic-effects"

[[example]]
name = "tweens"

[[example]]
name = "fx-chart"

[[bench]]
name = "color_interpolation"
harness = false

[[bench]]
name = "color_conversion"
harness = false

[[bench]]
name = "cell_filter"
harness = false

[[bench]]
name = "cell_iteration"
harness = false

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

